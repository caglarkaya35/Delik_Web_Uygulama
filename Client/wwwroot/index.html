<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delik Web Uygulaması</title>
    <base href="/" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="Client.styles.css" rel="stylesheet" />
    <style>
        html, body, #app { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    </style>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
        window.downloadFileFromBase64 = function (fileName, base64, mimeType) {
            const link = document.createElement('a');
            link.href = 'data:' + mimeType + ';base64,' + base64;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };

        window.gkodDosyalariniKaydet = async function (dosyalar) {
            // Birincil: File System Access API ile klasöre kaydet
            if (typeof window.showDirectoryPicker !== 'undefined') {
                try {
                    const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
                    for (const dosya of dosyalar) {
                        const fileHandle = await dirHandle.getFileHandle(dosya.ad, { create: true });
                        const writable = await fileHandle.createWritable();
                        await writable.write(dosya.icerik);
                        await writable.close();
                    }
                    return { basari: true, mesaj: dosyalar.length + ' dosya klasöre kaydedildi' };
                } catch (err) {
                    if (err.name === 'AbortError') {
                        return { basari: false, mesaj: 'İptal edildi' };
                    }
                    // API başarısız → ZIP'e geç
                }
            }
            // Fallback: JSZip ile tek ZIP dosyası olarak indir
            const zip = new JSZip();
            for (const dosya of dosyalar) {
                zip.file(dosya.ad, dosya.icerik);
            }
            const blob = await zip.generateAsync({ type: 'blob' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const tarih = new Date().toISOString().slice(0, 10).replace(/-/g, '');
            a.download = tarih + '_cnc_dosyalari.zip';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            return { basari: true, mesaj: dosyalar.length + ' dosya ZIP olarak indirildi' };
        };
    </script>
</body>

</html>
